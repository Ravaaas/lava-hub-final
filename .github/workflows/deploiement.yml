name: Mise en ligne

# Publie la nouvelle version (dossier app/, compilée dans dist/) sur GitHub Pages, seulement si tout est vert.
# Verrouillé tant que la variable du dépôt DEPLOIEMENT_NOUVELLE_VERSION ne vaut pas « oui »
# (Settings > Secrets and variables > Actions > Variables), et que Pages n'est pas réglé sur « GitHub Actions »
# (Settings > Pages > Source). Retour arrière : remettre Pages sur « Deploy from a branch » (main, racine) :
# l'ancienne version (index.html à la racine) revient aussitôt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    if: vars.DEPLOIEMENT_NOUVELLE_VERSION == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Qualité, tests unitaires, compilation
        run: npm run check
      - name: Parcours de l'équipe sur la version compilée
        run: CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium) node tests/nouvelle-version.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
